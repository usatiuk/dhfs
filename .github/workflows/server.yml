name: Server

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  build-dhfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install sudo for ACT
        run: apt-get update && apt-get install -y sudo
        if: env.ACT=='true'

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libfuse3-dev libfuse3-3 fuse3

      - name: User allow other for fuse
        run: echo "user_allow_other" | sudo tee -a /etc/fuse.conf

      - name: Dump fuse.conf
        run: cat /etc/fuse.conf

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
          cache: maven

      - name: Build LazyFS
        run: cd thirdparty/lazyfs/ && ./build.sh

      - name: Test with Maven
        run: cd dhfs-parent && mvn -T $(nproc) --batch-mode --update-snapshots package verify javadoc:aggregate

      - uses: actions/upload-artifact@v4
        with:
          name: DHFS Server Package
          path: dhfs-parent/dhfs-fuse/target/quarkus-app

      - uses: actions/upload-artifact@v4
        with:
          name: DHFS Javadocs
          path: dhfs-parent/target/reports/apidocs/

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Test logs
          path: ./**/target/*-reports

  build-webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "webui/package.json"

      - name: NPM Install
        run: cd webui && npm i

      - name: NPM Build
        run: cd webui && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Webui
          path: webui/dist

  package-launcher:
    needs: [build-webui, build-dhfs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-zip
            os: macos-14
            artifact_suffix: macos-arm64
            package_format: zip
          - name: linux-appimage-x86_64
            os: ubuntu-24.04
            artifact_suffix: linux-x86_64
            package_format: appimage
            appimage_arch: x86_64
          - name: linux-appimage-aarch64
            os: ubuntu-24.04-arm64
            artifact_suffix: linux-aarch64
            package_format: appimage
            appimage_arch: aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DHFS server package
        uses: actions/download-artifact@v4
        with:
          name: DHFS Server Package
          path: artifacts/dhfs-server

      - name: Download WebUI bundle
        uses: actions/download-artifact@v4
        with:
          name: Webui
          path: artifacts/webui

      - name: Install AppImage dependencies
        if: matrix.package_format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 squashfs-tools

      - name: Configure launcher
        run: |
          cmake -S launcher -B build-launcher \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxWidgets_IN_TREE_BUILD=ON \
            -DDHFS_PACKAGE_USE_PREBUILT=ON \
            -DDHFS_PREBUILT_SERVER_DIR="${{ github.workspace }}/artifacts/dhfs-server/quarkus-app" \
            -DDHFS_PREBUILT_WEBUI_DIR="${{ github.workspace }}/artifacts/webui"

      - name: Build launcher bundle
        run: |
          cmake --build build-launcher --config Release
          cmake --build build-launcher --config Release --target dhfs_package_bundle

      - name: Run CPack (ZIP)
        if: matrix.package_format == 'zip'
        run: |
          cd build-launcher
          cpack -G ZIP --config CPackConfig.cmake

      - name: Run CPack (AppImage)
        if: matrix.package_format == 'appimage'
        run: |
          cd build-launcher
          cpack -G AppImage --config CPackConfig.cmake

      - name: Upload launcher artifact (ZIP)
        if: matrix.package_format == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: DHFS Launcher ${{ matrix.artifact_suffix }}
          path: build-launcher/dhfs-launcher-*.zip

      - name: Upload launcher artifact (AppImage)
        if: matrix.package_format == 'appimage'
        uses: actions/upload-artifact@v4
        with:
          name: DHFS Launcher ${{ matrix.artifact_suffix }}
          path: build-launcher/dhfs-launcher-*-${{ matrix.appimage_arch }}.AppImage
  publish-run-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    needs: [build-webui, build-dhfs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DHFS Server Package
          path: dhfs-package-downloaded

      - uses: actions/download-artifact@v4
        with:
          name: Webui
          path: webui-dist-downloaded

      - name: Show all the files
        run: find .

      - name: Make run wrapper dirs
        run: mkdir -p run-wrapper-out/dhfs/data && mkdir -p run-wrapper-out/dhfs/fuse && mkdir -p run-wrapper-out/dhfs/app

      - name: Copy DHFS
        run: cp -r ./dhfs-package-downloaded "run-wrapper-out/dhfs/app/Server"

      - name: Copy Webui
        run: cp -r ./webui-dist-downloaded "run-wrapper-out/dhfs/app/Webui"

      - name: Copy run wrapper
        run: cp -r ./run-wrapper/* "run-wrapper-out/dhfs/app/"

      - name: Copy README
        run: |
          cp README.md "run-wrapper-out/dhfs/"

      - name: Add version to run wrapper
        run: echo $GITHUB_RUN_ID > "run-wrapper-out/dhfs/app/"version

      - name: Tar run wrapper
        run: tar -cvf ~/run-wrapper.tar.gz ./run-wrapper-out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Run wrapper
          path: ~/run-wrapper.tar.gz

  publish-javadoc:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    needs: [build-webui, build-dhfs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DHFS Javadocs
          path: dhfs-javadocs-downloaded

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dhfs-javadocs-downloaded"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
